{% extends "main/base.html" %}
{% load form_tags %}
{% block title %}Download Special Report{% endblock %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">📤 Upload CSV</h3>

                    <div class="container mt-5">
                        <h3>Upload CSV File</h3>

                        <!-- Upload Form -->
                        <form id="uploadForm" enctype="multipart/form-data" class="mb-3">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="simulation_id" class="form-label">Choose Simulation</label>
                                <select name="simulation_id" id="simulation_id" class="form-select" required>
                                    <option value="">-- Select Simulation --</option>
                                    {% for sim in simulations %}
                                    <option value="{{ sim.id }}">{{ sim.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="file" class="form-label">Upload CSV/Excel File</label>
                                <input type="file" name="file" id="file" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Upload</button>
                        </form>

                        <div id="message" class="mt-3"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div id="overlay" style="display:none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

{% endblock %}
{% block script %}
<script>
    let uploadedFile = null;  // To keep reference to the file

    $(document).ready(function () {
        // First form - get sheet names
        $("#uploadForm").submit(function (e) {
            e.preventDefault();
            $("#message").html('');

            const formData = new FormData(this);
            uploadedFile = formData.get("file"); // save the file for later
            let file_name = uploadedFile.name;

            $.ajax({
                url: "{% url 'processDownloadSpecialReport' %}",
                type: "POST",
                data: formData,
                processData: false,
                contentType: false,
                xhrFields: { responseType: 'blob' },
                //headers: { "X-CSRFToken": csrf_token },
                beforeSend: function(){
                    $("#overlay").show();
                },
                success: function (blob) {
                    let url = window.URL.createObjectURL(blob);
                    let a = document.createElement("a");
                    a.href = url;
                    a.download = "processed_" + file_name;
                    a.click();
                    window.URL.revokeObjectURL(url);
                },
                error: function () {
                    $("#message").html(`<div class='alert alert-danger'>Error while processing file.</div>`);
                },
                complete: function(){
                     $("#overlay").hide();
                }
            });
        });
    });
</script>
{% endblock %}
